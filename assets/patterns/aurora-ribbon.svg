<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
  <title id="title">FAANOMATE aurora ribbon pattern</title>
  <desc id="desc">Flowing light ribbon pattern for hero overlays and separators.</desc>
  <defs>
<linearGradient id="luminous" x1="0%" y1="10%" x2="100%" y2="90%">
  <stop offset="0%" stop-color="#00F5E9"/><stop offset=".38" stop-color="#14D9B8"/>
  <stop offset=".72" stop-color="#9CFFB8"/><stop offset="1" stop-color="#D7FF6A"/>
</linearGradient>
<linearGradient id="luminousReverse" x1="0%" y1="90%" x2="100%" y2="10%">
  <stop offset="0%" stop-color="#D7FF6A"/><stop offset=".34" stop-color="#9CFFB8"/>
  <stop offset=".7" stop-color="#14D9B8"/><stop offset="1" stop-color="#00F5E9"/>
</linearGradient>
<linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#00E5FF"/><stop offset=".52" stop-color="#8A3DFF"/><stop offset="1" stop-color="#FF2E9B"/>
</linearGradient>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
  <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="smallGlow" x="-70%" y="-70%" width="240%" height="240%">
  <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
  <path d="M-20 230C60 130 126 282 210 178s124-28 180-120" fill="none" stroke="url(#luminous)" stroke-width="30" stroke-linecap="round" opacity=".36" filter="url(#glow)"/><path d="M-20 230C60 130 126 282 210 178s124-28 180-120" fill="none" stroke="url(#luminous)" stroke-width="4" stroke-linecap="round"/><path d="M-20 276C64 190 132 314 214 218s118-26 176-118" fill="none" stroke="#00F5E9" stroke-width="1.5" opacity=".42"/>
</svg>
