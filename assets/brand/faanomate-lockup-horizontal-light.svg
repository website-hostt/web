<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 280" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">FAANOMATE horizontal logo lockup</title>
  <desc id="desc">Reference-traced FAANOMATE wordmark as clean vector paths; no font dependency and no glow.</desc>
  <svg x="30" y="25" width="360" height="194" viewBox="0 0 500 270" preserveAspectRatio="xMidYMid meet">
  <title id="title">FAANOMATE final flowing FM monogram</title>
  <desc id="desc">Clean path-based FAANOMATE FM ribbon logo using the Lumen Cascade palette, without glow or background.</desc>

  <defs>
    <linearGradient id="rear-ribbon" x1="25" y1="210" x2="330" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00F5E9"/>
      <stop offset="0.48" stop-color="#14D9B8"/>
      <stop offset="1" stop-color="#9CFFB8"/>
    </linearGradient>
    <linearGradient id="front-ribbon" x1="60" y1="120" x2="470" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00F5E9"/>
      <stop offset="0.34" stop-color="#14D9B8"/>
      <stop offset="0.67" stop-color="#9CFFB8"/>
      <stop offset="1" stop-color="#D7FF6A"/>
    </linearGradient>
    <linearGradient id="leaf-ribbon" x1="95" y1="250" x2="220" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00F5E9"/>
      <stop offset="0.55" stop-color="#14D9B8"/>
      <stop offset="1" stop-color="#9CFFB8"/>
    </linearGradient>
    <linearGradient id="drop-ribbon" x1="250" y1="110" x2="278" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14D9B8"/>
      <stop offset="1" stop-color="#9CFFB8"/>
    </linearGradient>
  </defs>

  <!-- Rear arch: the high left sweep of the supplied FM mark. -->
  <path fill="url(#rear-ribbon)" d="
    M 28 207
    C 54 172 78 122 108 77
    C 139 31 174 8 205 13
    C 242 18 253 50 270 94
    C 287 138 301 177 329 199
    C 313 201 296 188 282 165
    C 264 134 249 98 232 70
    C 212 38 191 31 166 43
    C 127 62 103 107 76 153
    C 55 187 40 204 28 207 Z"/>

  <!-- Lower-left leaf / front ribbon. -->
  <path fill="url(#leaf-ribbon)" d="
    M 99 246
    C 98 222 97 195 106 178
    C 118 153 143 141 177 138
    C 193 137 208 128 220 114
    C 207 140 189 152 164 159
    C 143 166 137 181 132 203
    C 127 225 115 241 99 246 Z"/>

  <!-- Central tapered drop. -->
  <path fill="url(#drop-ribbon)" d="
    M 249 108
    C 260 122 271 148 274 169
    C 276 198 262 228 249 245
    L 249 108 Z"/>

  <!-- Main front wave: central crossing, valley, right rise, and right end. -->
  <path fill="url(#front-ribbon)" d="
    M 64 119
    C 93 88 126 68 157 61
    C 192 53 218 69 240 106
    C 262 143 280 183 304 195
    C 328 207 349 196 369 166
    C 391 133 411 105 432 97
    C 451 90 466 99 468 118
    L 469 242
    C 451 227 435 210 428 191
    C 418 166 418 136 430 119
    C 438 107 451 107 455 119
    L 456 207
    C 443 197 432 183 429 164
    C 426 143 432 123 444 112
    C 431 101 416 116 403 136
    C 383 165 367 198 340 209
    C 310 222 286 206 267 181
    C 240 146 226 106 203 83
    C 181 60 155 67 132 84
    C 104 104 83 126 64 119 Z"/>

  <!-- Quiet inner planes preserve the layered-ribbon character without effects. -->
  <path fill="#00F5E9" opacity="0.30" d="
    M 28 207
    C 56 168 81 116 111 73
    C 139 33 174 10 205 13
    C 172 24 142 50 116 89
    C 85 135 63 185 28 207 Z"/>
  <path fill="#9CFFB8" opacity="0.28" d="
    M 267 181
    C 241 146 226 106 203 83
    C 181 60 155 67 132 84
    C 160 72 184 82 204 108
    C 229 140 244 180 267 205
    C 277 216 289 225 304 228
    C 287 211 276 195 267 181 Z"/>
  <path fill="#D7FF6A" opacity="0.28" d="
    M 340 209
    C 369 196 383 165 403 136
    C 416 116 431 101 444 112
    C 427 117 411 145 397 169
    C 380 198 363 220 340 228 Z"/>
</svg>
  <path d="M430 42V238" stroke="#14D9B8" stroke-width="2"/>
  <g transform="translate(485 54) scale(.72 1)" fill="#060B1F" fill-rule="evenodd" shape-rendering="geometricPrecision" aria-label="FAANOMATE"><path d="M0 0H39V8H10V19H33V26H10V48H0Z" transform="translate(0 0)"/><path d="M0 48 24 0H33L57 48H45L29 13 12 48Z" transform="translate(69 0)"/><path d="M0 48 24 0H33L57 48H45L29 13 12 48Z" transform="translate(160 0)"/><path d="M0 0H10L39 36V0H49V48H39L10 12V48H0Z" transform="translate(254 0)"/><path d="M28 0C12 0 0 10 0 24.5S12 49 28 49 56 39 56 24.5 44 0 28 0ZM28 10C39 10 46 15.5 46 24.5S39 39 28 39 10 33.5 10 24.5 17 10 28 10Z" transform="translate(338 0)"/><path d="M0 47V0H10L29 29 49 0H59V47H49V15L34 36C31 40 27 40 24 36L10 15V47Z" transform="translate(429 1)"/><path d="M0 48 24 0H33L57 48H45L29 13 12 48Z" transform="translate(526 1)"/><path d="M0 0H44V8H26V47H17V8H0Z" transform="translate(609 1)"/><path d="M0 0H38V8H9V19H32V27H9V39H38V47H0Z" transform="translate(687 1)"/></g>
  <text x="490" y="174" fill="#14D9B8" font-family="Arial, sans-serif" font-size="22" letter-spacing="8">CREATE. BUILD. AUTOMATE.</text>
</svg>
